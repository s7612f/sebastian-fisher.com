<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sebastian Fisher</title>
<meta name="description" content="Sebastian Fisher. Contact by email or WhatsApp.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a0a0b; --white:#f2f0eb; --red:#e6392e; }
  * { box-sizing:border-box; margin:0; }
  body {
    min-height:100vh; min-height:100dvh;
    display:grid; place-items:center; padding:24px;
    background:var(--black); color:var(--white);
    font-family:"Inter",system-ui,sans-serif;
  }
  main { width:100%; max-width:560px; text-align:center; }
  h1 {
    font-family:"Anton",sans-serif; font-weight:400;
    font-size:clamp(4.2rem,20vw,8.5rem); line-height:.92;
    text-transform:uppercase; letter-spacing:.01em;
    margin-bottom:clamp(36px,7vw,64px);
  }
  html { overflow-x:clip; }
  h1 .l { display:block; }
  h1 .l > b { display:block; font-weight:400; will-change:transform; backface-visibility:hidden; }
  h1 .l:nth-child(1) > b { transform-origin:50% 100%; animation:drop 2.4s .2s backwards; }
  h1 .l:nth-child(2) > b { transform-origin:50% 0%; animation:rise 2.4s .8s backwards; }
  .buttons .btn { will-change:transform; backface-visibility:hidden; animation:slide 1.6s cubic-bezier(.16,1,.3,1) backwards; }
  .btn:nth-child(1) { --fx:-60vw; --fy:30vh; animation-delay:2.9s; }
  .btn:nth-child(2) { --fx:60vw; --fy:30vh; animation-delay:3.2s; }
  @keyframes drop {
    0%   { transform:translateY(-90vh) scale(3.5); opacity:0; animation-timing-function:cubic-bezier(.45,0,.8,.5); }
    10%  { opacity:1; }
    62%  { transform:translateY(0) scale(.95); animation-timing-function:cubic-bezier(.2,.9,.3,1); }
    80%  { transform:scale(1.015); animation-timing-function:ease-in-out; }
    100% { transform:translateZ(0); }
  }
  @keyframes rise {
    0%   { transform:translateY(90vh) scale(3.5); opacity:0; animation-timing-function:cubic-bezier(.45,0,.8,.5); }
    10%  { opacity:1; }
    62%  { transform:translateY(0) scale(.95); animation-timing-function:cubic-bezier(.2,.9,.3,1); }
    80%  { transform:scale(1.015); animation-timing-function:ease-in-out; }
    100% { transform:translateZ(0); }
  }
  @keyframes slide {
    0%   { opacity:0; transform:translate(var(--fx),var(--fy)); animation-timing-function:cubic-bezier(.3,.6,.3,1); }
    40%  { opacity:1; }
    100% { transform:translateZ(0); }
  }
  h1 .l:nth-child(2) { color:var(--red); }
  .buttons { display:grid; gap:12px; }
  .btn {
    position:relative; overflow:hidden; isolation:isolate;
    display:block; text-align:center;
    padding:26px 24px;
    border:2px solid var(--white); border-radius:0;
    color:var(--white); text-decoration:none;
    font-weight:800; font-size:1.05rem; letter-spacing:.32em; text-transform:uppercase;
    transition:color .6s ease, border-color .6s ease, letter-spacing .7s cubic-bezier(.16,1,.3,1), transform .25s ease;
  }
  .btn::before {
    content:""; position:absolute; inset:0; z-index:-1;
    background:var(--red);
    transform:scaleX(0); transform-origin:right;
    transition:transform .75s cubic-bezier(.16,1,.3,1);
  }
  .btn:hover, .btn:focus-visible { border-color:var(--red); color:var(--white); }
  .btn:hover, .btn:focus-visible { letter-spacing:.4em; }
  .btn:hover::before, .btn:focus-visible::before { transform:scaleX(1); transform-origin:left; }
  .btn:active { transform:scale(.985); transition-duration:.15s; }
  .btn:focus-visible { outline:3px solid var(--red); outline-offset:4px; }
  @media (prefers-reduced-motion:reduce) { .btn, .btn::before { transition:none; } h1 .l > b, .buttons .btn { animation:none; } }
</style>
</head>
<body>
<main>
  <h1><span class="l"><b>Sebastian</b></span><span class="l"><b>Fisher</b></span></h1>
  <div class="buttons">
    <a class="btn" href="mailto:contact@sebastian-fisher.com">Email</a>
    <a class="btn" href="https://wa.me/447496345233" rel="noopener">WhatsApp</a>
  </div>
</main>
</body>
</html>
